, 'style': 'dashed', 'width': 4}, {'x1': 199.5, 'y1': 799.5, 'x2': 162.0, 'y2': 837.0, 'color': 'black', 'style': 'dashed', 'width': 4}, {'x1': 274.5, 'y1': 799.5, 'x2': 312.0, 'y2': 837.0, 'color': 'black', 'style': 'dashed', 'width': 4}, {'x1': 349.5, 'y1': 799.5, 'x2': 312.0, 'y2': 837.0, 'color': 'black', 'style': 'dashed', 'width': 4}, {'x1': 424.5, 'y1': 799.5, 'x2': 462.0, 'y2': 837.0, 'color': 'black', 'style': 'dashed', 'width': 4}, {'x1': 499.5, 'y1': 799.5, 'x2': 462.0, 'y2': 837.0, 'color': 'black', 'style': 'dashed', 'width': 4}, {'x1': 574.5, 'y1': 799.5, 'x2': 612.0, 'y2': 837.0, 'color': 'black', 'style': 'dashed', 'width': 4}, {'x1': 649.5, 'y1': 799.5, 'x2': 612.0, 'y2': 837.0, 'color': 'black', 'style': 'dashed', 'width': 4}, {'x1': 724.5, 'y1': 799.5, 'x2': 762.0, 'y2': 837.0, 'color': 'black', 'style': 'dashed', 'width': 4}, {'x1': 799.5, 'y1': 799.5, 'x2': 762.0, 'y2': 837.0, 'color': 'black', 'style': 'dashed', 'width': 4}];

        const svg = d3.select("#graph");
        d3.selectAll(".d3-tooltip").remove();
        const tooltip = d3.select("body")
            .append("div")
            .attr("class", "d3-tooltip");

        // Draw edges first (bottom layer)
        const edges = svg.selectAll(".edge")
            .data(edgesData)
            .enter()
            .append("line")
            .attr("class", "edge")
            .attr("x1", d => d.x1)
            .attr("y1", d => d.y1)
            .attr("x2", d => d.x2)
            .attr("y2", d => d.y2)
            .attr("stroke", d => d.color)
            .attr("stroke-width", d => d.width)
            .attr("stroke-dasharray", d => d.style === "dashed" ? "5,5" : "none");

        // Create node groups
        const nodes = svg.selectAll(".node")
            .data(nodesData)
            .enter()
            .append("g")
            .attr("class", "node")
            .attr("transform", d => `translate(${d.x},${d.y})`);

        // Draw node shapes
        nodes.each(function(d) {
            const node = d3.select(this);
            if (d.type === "qubit") {
                // Circle for qubits
                node.append("circle")
                    .attr("r", d.radius)
                    .attr("fill", d.fill)
                    .attr("stroke", d.color)
                    .attr("stroke-width", 2);
            } else {
                // Square for checks
                node.append("rect")
                    .attr("x", -d.radius)
                    .attr("y", -d.radius)
                    .attr("width", d.radius * 2)
                    .attr("height", d.radius * 2)
                    .attr("fill", d.fill)
                    .attr("stroke", d.color)
                    .attr("stroke-width", 2);
            }
        });

        // Add labels
        nodes.append("text")
            .attr("class", "node-label")
            .attr("x", d => d.radius + 5)
            .attr("y", 5)
            .attr("text-anchor", "start")
            .text(d => d.label);

        // Tooltip helpers
        function positionTooltip(event) {
            const tooltipNode = tooltip.node();
            if (!tooltipNode) {
                return;
            }
            const pageX = (event.pageX !== undefined ? event.pageX : event.clientX + window.scrollX);
            const pageY = (event.pageY !== undefined ? event.pageY : event.clientY + window.scrollY);
            const tooltipWidth = tooltipNode.offsetWidth || 0;
            const tooltipHeight = tooltipNode.offsetHeight || 0;

            let x = pageX + 16;
            let y = pageY - tooltipHeight / 2;

            const maxX = window.pageXOffset + window.innerWidth - tooltipWidth - 12;
            const minX = window.pageXOffset + 12;
            const maxY = window.pageYOffset + window.innerHeight - tooltipHeight - 12;
            const minY = window.pageYOffset + 12;

            if (x > maxX) {
                x = maxX;
            }
            if (x < minX) {
                x = minX;
            }
            if (y > maxY) {
                y = maxY;
            }
            if (y < minY) {
                y = minY;
            }

            tooltip.style("left", x + "px")
                   .style("top", y + "px");
        }

        nodes.on("mouseover", function(event, d) {
            tooltip.html("<b>" + d.label + "</b><br>Type: " + d.type)
                .style("visibility", "visible")
                .style("opacity", 1);
            positionTooltip(event);
        })
        .on("mousemove", function(event) {
            positionTooltip(event);
        })
        .on("mouseout", function() {
            tooltip.style("opacity", 0)
                .style("visibility", "hidden");
        });
    </script>
